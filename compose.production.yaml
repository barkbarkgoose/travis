name: travis-recovery

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: travis_recovery
      POSTGRES_USER: travis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travis -d travis_recovery"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    # No published database port. Only the internal Docker network can reach it.

  app:
    image: travis-recovery:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release identifier}
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set a stable SECRET_KEY}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set a stable Fernet key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set the real hostname}
      # POSTGRES_PASSWORD must contain only URL-safe letters/numbers/_/-.
      DATABASE_URL: postgresql://travis:${POSTGRES_PASSWORD}@db:5432/travis_recovery?connect_timeout=5&options=-c%20statement_timeout%3D5000
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-filesystem}
      MEDIA_ROOT: /data/media
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_CREDENTIALS_JSON_B64: ${GCS_CREDENTIALS_JSON_B64:-}
      NUM_PROXIES: "1"
      TRUST_PROXY_SSL_HEADER: "True"
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-86400}
      PORT: "8000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          host = os.environ['ALLOWED_HOSTS'].split(',')[0].strip();
          request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'});
          response = urllib.request.urlopen(request, timeout=3);
          assert response.status == 200 and json.load(response) == {'status': 'ok'}
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

volumes:
  postgres_data:
  media_data:
